# Para propósitos de desarrollo y pruebas locales
services:
  emqx:
    container_name: emqx
    image: emqx/emqx:5.8.4
    restart: always
    ports:
      - 18083:18083
      - 8083:8083
      - 1883:1883

  mongo:
    container_name: mongo_iot
    image: mongo:8
    restart: always
    ports:
      - 27020:27017
    volumes:
      - ./myData:/data/db

  mongo-e2e:
    container_name: mongo_iot_e2e
    image: mongo:8
    ports:
      - 27021:27017
